name: sportfield_booking
description: Ứng dụng quản lý và đặt sân thể thao - Đồ án môn Phát triển ứng dụng di động
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  path: ^1.9.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/auth_banners/
    - assets/data/mock_data.json
    - assets/db/database.sql
    - assets/sports_dataset/
    - assets/sports_dataset/football/
    - assets/sports_dataset/badminton/
    - assets/sports_dataset/tennis/
    - assets/sports_dataset/basketball/
    - assets/sports_dataset/pickleball/
    - assets/payment/
    - assets/services/
